name: Build Full Media Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Offline Media Player Codebase
        run: |
          mkdir -p app/src/main/java/com/example/adaptivemediaoptimizer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MSMediaPlayer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.adaptivemediaoptimizer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.adaptivemediaoptimizer"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "2.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.activity:activity-ktx:1.8.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-ui:1.3.1'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="bg_main">#0A0E17</color>
              <color name="card_bg">#131B2A</color>
              <color name="card_border">#1E293B</color>
              <color name="primary_cyan">#00E5FF</color>
              <color name="primary_green">#00E676</color>
              <color name="text_white">#FFFFFF</color>
              <color name="text_dim">#94A3B8</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.MSPlayer" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">@color/primary_cyan</item>
                  <item name="colorSecondary">@color/primary_green</item>
                  <item name="android:windowBackground">@color/bg_main</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="M.S Media Player"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MSPlayer">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_video.xml
          <?xml version="1.0" encoding="utf-8"?>
          <com.google.android.material.card.MaterialCardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginBottom="8dp"
              app:cardBackgroundColor="@color/card_bg"
              app:strokeColor="@color/card_border"
              app:strokeWidth="1dp"
              app:cardCornerRadius="12dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="12dp"
                  android:gravity="center_vertical">

                  <TextView
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:background="#1E293B"
                      android:gravity="center"
                      android:text="▶"
                      android:textColor="@color/primary_cyan"
                      android:textSize="18sp"/>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/txtVideoTitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="@color/text_white"
                          android:textSize="14sp"
                          android:textStyle="bold"
                          android:maxLines="1"
                          android:ellipsize="end"
                          android:text="Video Title.mp4"/>

                      <TextView
                          android:id="@+id/txtVideoMeta"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="@color/text_dim"
                          android:textSize="11sp"
                          android:layout_marginTop="2dp"
                          android:text="14.2 MB • 03:20"/>
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnPlayItem"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:text="انتخاب"
                      android:textSize="11sp"
                      android:backgroundTint="#2A384F"
                      android:textColor="@color/primary_cyan"
                      app:cornerRadius="6dp"/>
