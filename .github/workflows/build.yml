          cat << 'EOF' > app/src/main/java/com/example/adaptivemediaoptimizer/MediaItemModel.kt
          package com.example.adaptivemediaoptimizer

          import android.net.Uri

          data class MediaVideoItem(
              val name: String,
              val uri: Uri,
              val info: String
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/example/adaptivemediaoptimizer/MediaAdapter.kt
          package com.example.adaptivemediaoptimizer

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class MediaAdapter(
              private val list: List<MediaVideoItem>,
              private val onSelect: (MediaVideoItem) -> Unit
          ) : RecyclerView.Adapter<MediaAdapter.MediaViewHolder>() {

              class MediaViewHolder(v: View) : RecyclerView.ViewHolder(v) {
                  val txtTitle: TextView = v.findViewById(R.id.txtVideoTitle)
                  val txtMeta: TextView = v.findViewById(R.id.txtVideoMeta)
                  val btnPlay: Button = v.findViewById(R.id.btnPlayItem)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): MediaViewHolder {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_video, parent, false)
                  return MediaViewHolder(view)
              }

              override fun onBindViewHolder(holder: MediaViewHolder, position: Int) {
                  val item = list[position]
                  holder.txtTitle.text = item.name
                  holder.txtMeta.text = item.info
                  holder.itemView.setOnClickListener { onSelect(item) }
                  holder.btnPlay.setOnClickListener { onSelect(item) }
              }

              override fun getItemCount(): Int = list.size
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/adaptivemediaoptimizer/MainActivity.kt
          package com.example.adaptivemediaoptimizer

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.trackselection.DefaultTrackSelector
          import androidx.media3.ui.PlayerView
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.switchmaterial.SwitchMaterial
          import java.io.File
          import java.io.FileWriter

          data class ThesisRecord(
              val time: Long,
              val videoName: String,
              val playheadMs: Long,
              val batteryLevel: Float,
              val voltageMv: Int,
              val profileMode: String
          )

          class MainActivity : AppCompatActivity() {
              private var playerView: PlayerView? = null
              private var player: ExoPlayer? = null
              private var isOptimized = false
              private var currentUri: Uri? = null
              private var currentName = "هیچ فایلی انتخاب نشده"

              private val thesisLogs = mutableListOf<ThesisRecord>()
              private val handler = Handler(Looper.getMainLooper())
              private val mediaItems = mutableListOf<MediaVideoItem>()
              private lateinit var adapter: MediaAdapter

              private val filePickerLauncher = registerForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  uri?.let {
                      currentUri = it
                      currentName = it.lastPathSegment ?: "Custom File"
                      loadAndPlayVideo(it, currentName)
                  }
              }

              private val permLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) {
                  scanDeviceVideos()
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      try {
                          val rec = collectMetric()
                          thesisLogs.add(rec)
                          findViewById<TextView>(R.id.txtBattery)?.text = "🔋 باتری: ${String.format("%.1f", rec.batteryLevel)}%"
                          findViewById<TextView>(R.id.txtVoltage)?.text = "⚡ ولتاژ: ${rec.voltageMv} mV"
                      } catch (e: Throwable) {
                          e.printStackTrace()
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      setContentView(R.layout.activity_main)
                      playerView = findViewById(R.id.playerView)

                      val switchMode = findViewById<SwitchMaterial>(R.id.switchMode)
                      val btnOpenFile = findViewById<Button>(R.id.btnOpenFile)
                      val btnExportCsv = findViewById<Button>(R.id.btnExportCsv)
                      val rvMediaList = findViewById<RecyclerView>(R.id.rvMediaList)

                      rvMediaList.layoutManager = LinearLayoutManager(this)
                      adapter = MediaAdapter(mediaItems) { item ->
                          currentUri = item.uri
                          currentName = item.name
                          loadAndPlayVideo(item.uri, item.name)
                      }
                      rvMediaList.adapter = adapter

                      buildPlayerInstance(isOptimized)
                      requestStorageAndScan()

                      btnOpenFile.setOnClickListener {
                          filePickerLauncher.launch("video/*")
                      }

                      switchMode.setOnCheckedChangeListener { _, isChecked ->
                          isOptimized = isChecked
                          findViewById<TextView>(R.id.txtModeTitle)?.text = 
                              if (isChecked) "پروفایل: حالت بهینه‌ساز هوشمند انرژی" else "پروفایل: حالت پخش عادی"
                          findViewById<TextView>(R.id.txtModeSubtitle)?.text = 
                              if (isChecked) "بافر عمیق و کاهش توان پردازشی فعال است" else "پخش با حداکثر ظرفیت سخت‌افزاری"
                          
                          // بازسازی پلیر با اعمال پروفایل جدید بدون توقف موقعیت ویدیو
                          buildPlayerInstance(isOptimized)
                      }

                      btnExportCsv.setOnClickListener {
                          exportToCsv()
                      }

                      handler.post(ticker)
                  } catch (e: Throwable) {
                      e.printStackTrace()
                  }
              }

              private fun buildPlayerInstance(optimized: Boolean) {
                  try {
                      val resumePos = player?.currentPosition ?: 0L
                      player?.release()

                      val trackSelector = DefaultTrackSelector(this)

                      val loadControl = if (optimized) {
                          // حالت بهینه انرژی: افزایش زمان بافر جهت کاهش دفعات Wake-up پردازنده و رم
                          DefaultLoadControl.Builder()
                              .setBufferDurationsMs(25000, 60000, 3000, 5000)
                              .build()
                      } else {
                          // حالت عادی: بافر استاندارد با بارگذاری لحظه‌ای
                          DefaultLoadControl.Builder()
                              .setBufferDurationsMs(2500, 10000, 1000, 1500)
                              .build()
                      }

                      player = ExoPlayer.Builder(this)
                          .setTrackSelector(trackSelector)
                          .setLoadControl(loadControl)
                          .build()

                      playerView?.player = player

                      currentUri?.let { uri ->
                          val mediaItem = MediaItem.fromUri(uri)
                          player?.setMediaItem(mediaItem)
                          player?.seekTo(resumePos)
                          player?.prepare()
                          player?.playWhenReady = true
                      }
                  } catch (e: Throwable) {
                      e.printStackTrace()
                  }
              }

              private fun loadAndPlayVideo(uri: Uri, name: String) {
                  try {
                      currentUri = uri
                      currentName = name
                      findViewById<TextView>(R.id.txtCurrentPlaying)?.text = "در حال پخش: $name"
                      val item = MediaItem.fromUri(uri)
                      player?.setMediaItem(item)
                      player?.prepare()
                      player?.playWhenReady = true
                      Toast.makeText(this, "پخش: $name", Toast.LENGTH_SHORT).show()
                  } catch (e: Throwable) {
                      Toast.makeText(this, "خطا در پخش ویدیو", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun requestStorageAndScan() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) == PackageManager.PERMISSION_GRANTED) {
                          scanDeviceVideos()
                      } else {
                          permLauncher.launch(arrayOf(Manifest.permission.READ_MEDIA_VIDEO))
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED) {
                          scanDeviceVideos()
                      } else {
                          permLauncher.launch(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE))
                      }
                  }
              }

              private fun scanDeviceVideos() {
                  try {
                      mediaItems.clear()
                      val proj = arrayOf(
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.DISPLAY_NAME,
                          MediaStore.Video.Media.SIZE,
                          MediaStore.Video.Media.DURATION
                      )
                      contentResolver.query(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          proj,
                          null,
                          null,
                          "${MediaStore.Video.Media.DATE_ADDED} DESC"
                      )?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val name = cursor.getString(nameCol) ?: "Media Video"
                              val size = cursor.getLong(sizeCol)
                              val dur = cursor.getLong(durCol) / 1000
                              val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                              val min = dur / 60
                              val sec = dur % 60
                              val meta = String.format("%.1f MB • %02d:%02d", size / (1024f * 1024f), min, sec)
                              mediaItems.add(MediaVideoItem(name, uri, meta))
                          }
                      }
                      adapter.notifyDataSetChanged()
                      findViewById<TextView>(R.id.txtLibraryHeader)?.text = "📂 ویدیوهای گوشی (${mediaItems.size} ویدیو)"

                      if (mediaItems.isNotEmpty() && currentUri == null) {
                          loadAndPlayVideo(mediaItems[0].uri, mediaItems[0].name)
                      }
                  } catch (e: Throwable) {
                      e.printStackTrace()
                  }
              }

              private fun collectMetric(): ThesisRecord {
                  var batPct = 0f
                  var volt = 0
                  try {
                      val intent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val lvl = intent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                      val scale = intent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                      batPct = if (scale > 0) (lvl / scale.toFloat()) * 100f else 0f
                      volt = intent?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) ?: 0
                  } catch (e: Throwable) {
                      e.printStackTrace()
                  }

                  val pos = player?.currentPosition ?: 0L
                  return ThesisRecord(
                      time = System.currentTimeMillis(),
                      videoName = currentName,
                      playheadMs = pos,
                      batteryLevel = batPct,
                      voltageMv = volt,
                      profileMode = if (isOptimized) "Optimized_Energy_Mode" else "Standard_Normal_Mode"
                  )
              }

              private fun exportToCsv() {
                  try {
                      val dir = getExternalFilesDir(null) ?: filesDir
                      val file = File(dir, "MS_Player_Thesis_Dataset.csv")
                      val writer = FileWriter(file)
                      writer.append("Timestamp,VideoName,Playhead_ms,Battery_Pct,Voltage_mV,Profile_Mode\n")
                      for (r in thesisLogs) {
                          writer.append("${r.time},\"${r.videoName}\",${r.playheadMs},${r.batteryLevel},${r.voltageMv},${r.profileMode}\n")
                      }
                      writer.flush()
                      writer.close()
                      Toast.makeText(this, "فایل لاگ ذخیره شد: ${file.name}", Toast.LENGTH_LONG).show()
                  } catch (e: Throwable) {
                      Toast.makeText(this, "خطا در ذخیره فایل", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(ticker)
                  player?.release()
                  player = null
              }
          }
          EOF

      - name: Build and Sign Final APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle :app:assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk MS_MediaPlayer_v2.2.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS-MediaPlayer-v2.2
          path: MS_MediaPlayer_v2.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2-${{ github.run_number }}
          name: MS Media Player v2.2 (Local Edition)
          files: MS_MediaPlayer_v2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
